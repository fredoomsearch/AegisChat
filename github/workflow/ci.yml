name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            black \
            isort \
            ruff \
            mypy \
            pytest \
            sqlalchemy \
            types-requests \
            types-PyYAML

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: Ruff
        run: ruff .

      - name: mypy
        run: mypy .

      - name: Tests
        run: pytest -q
